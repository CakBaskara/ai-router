[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-router"
version = "0.2.0"
description = "Route each prompt to the cheapest Claude Code or Codex model that can answer it."
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
dependencies = ["textual>=8", "pillow>=10", "numpy>=1.26", "onnxruntime>=1.18", "tokenizers>=0.19", "platformdirs>=4"]

[project.scripts]
ai = "airouter.cli:main"

[tool.setuptools]
packages = ["airouter"]

[tool.setuptools.package-data]
airouter = ["config.toml", "seed_labels.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
